<!--
  Счётчик подписчиков Telegram-канала ПРО МТК (t.me/promtk).

  Инструкция:
  1. В Zero Block (или HTML-блоке) создайте текстовый элемент с числом подписчиков.
  2. Задайте FALLBACK_TEXT точно таким же текстом, какой стоит в этом элементе по умолчанию.
  3. Вставьте этот скрипт в HTML-блок на той же странице (или в блок «Код в <head>»).
  4. Если элементов со счётчиком несколько, укажите CSS-селектор в TARGET_SELECTOR.

  Данные обновляются автоматически раз в сутки (~01:00 МСК).
  Текущее число подписчиков: 1 654 (на 18.08.2026).
-->
<script>
(function () {
  var DATA_SCRIPT_URL = "https://juliljina.github.io/subscriber-counters/promtk-subscribers.js";
  var CHANNEL_USERNAME = "promtk";
  var FALLBACK_TEXT = "1 654 подписчика";
  var TARGET_SELECTOR = "";
  var MAX_ATTEMPTS = 40;
  var RETRY_DELAY_MS = 250;

  function normalizeUsername(value) {
    return String(value || "")
      .trim()
      .replace(/^https?:\/\/t\.me\//i, "")
      .replace(/^@/, "")
      .replace(/\/$/, "");
  }

  function getCounterElement() {
    if (TARGET_SELECTOR) {
      return document.querySelector(TARGET_SELECTOR);
    }

    var candidates = document.querySelectorAll(".tn-atom, [data-tg-subscriber-counter]");
    for (var i = 0; i < candidates.length; i += 1) {
      if ((candidates[i].textContent || "").trim() === FALLBACK_TEXT) {
        return candidates[i];
      }
    }

    return null;
  }

  function setCounterText(text, attempt, onlyIfEmpty) {
    var counter = getCounterElement();
    if (counter) {
      if (onlyIfEmpty && (counter.textContent || "").trim()) {
        return;
      }

      counter.textContent = text;
      return;
    }

    if (attempt < MAX_ATTEMPTS) {
      window.setTimeout(function () {
        setCounterText(text, attempt + 1, onlyIfEmpty);
      }, RETRY_DELAY_MS);
    }
  }

  function ensureFallbackText() {
    setCounterText(FALLBACK_TEXT, 0, true);
  }

  function applyCounter() {
    var username = normalizeUsername(CHANNEL_USERNAME);
    var data = window.TelegramSubscriberCounts;
    var channel = data && data.channels && data.channels[username];

    if (!channel || !channel.formatted) {
      ensureFallbackText();
      return;
    }

    setCounterText(channel.formatted, 0, false);
  }

  function loadDataScript() {
    if (!DATA_SCRIPT_URL) {
      ensureFallbackText();
      return;
    }

    if (window.TelegramSubscriberCounts) {
      applyCounter();
      return;
    }

    var script = document.createElement("script");
    script.src = DATA_SCRIPT_URL + (DATA_SCRIPT_URL.indexOf("?") === -1 ? "?" : "&") + "v=" + Math.floor(Date.now() / 3600000);
    script.async = true;
    script.onload = applyCounter;
    script.onerror = ensureFallbackText;
    document.head.appendChild(script);
  }

  function init() {
    ensureFallbackText();
    window.addEventListener("telegram-subscribers:loaded", applyCounter);
    loadDataScript();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
